# 沿用2026-11-26四方法实测清单；不含OS或持久性参数。
innodb_buffer_pool_size:
  type: integer
  default: 1073741824
  min: 536870912
  max: 4294967296
  step: 134217728
  special_values: []
  log_scale: true
  restart_required: false
  unit: bytes
  description: ''
innodb_io_capacity:
  type: integer
  default: 200
  min: 100
  max: 2000
  step: 100
  special_values: []
  log_scale: false
  restart_required: false
  unit: null
  description: ''
innodb_io_capacity_max:
  type: integer
  default: 2000
  min: 2000
  max: 6000
  step: 500
  special_values: []
  log_scale: false
  restart_required: false
  unit: null
  description: ''
innodb_thread_concurrency:
  type: integer
  default: 0
  min: 1
  max: 32
  step: 1
  special_values:
  - 0
  log_scale: false
  restart_required: false
  unit: null
  description: 0表示不限制InnoDB内部并发；普通值1到32，不是容器CPU核配额。0仅作为特殊值。
sort_buffer_size:
  type: integer
  default: 262144
  min: 262144
  max: 8388608
  step: 262144
  special_values: []
  log_scale: true
  restart_required: false
  unit: bytes
  description: ''

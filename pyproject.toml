[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticdb-artifact"
version = "0.7.3"
description = "ADMTune DBMS-only tuning extensions on the AgenticDB artifact"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "sqlglot>=26,<28",
  "paramiko>=3.4.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
]

[project.optional-dependencies]
replay = ["PyMySQL[rsa]>=1.1,<2"]

[project.scripts]
agenticdb = "main:main"
admtune = "admtune.cli:main"
admtune-live = "admtune.live:main"
admtune-experiments = "admtune.experiments:main"
admtune-replay = "admtune.replay:main"
admtune-replay-report = "admtune.replay_report:main"
admtune-phase-plan = "admtune.phase_safety:main"
admtune-dynamic = "admtune.dynamic:main"

[tool.setuptools]
py-modules = [
  "auditor",
  "config",
  "dbms_policy",
  "expert_candidates",
  "knob_selector",
  "llm_client",
  "loop",
  "main",
  "models",
]

[tool.setuptools.packages.find]
include = [
  "admtune*",
  "connectors*",
  "memory*",
  "profiles*",
  "skills*",
  "tools*",
  "utils*",
  "validators*",
]

[tool.setuptools.package-data]
skills = ["*.md"]
